<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEE MCQ Vault</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Dashboard -->
    <main id="dashboard">

        <header class="hero">
            <h1>EEE MCQ Vault</h1>
            <p>Practice Electrical & Electronics Engineering MCQs</p>

            <div class="stats-card">
                <span>Total Questions</span>
                <h2 id="totalQuestions">0</h2>
            </div>

        </header>

        <section id="topicsContainer">
            <!-- Topic cards will be generated here -->
        </section>

    </main>


    <!-- Practice Screen -->
    <main id="practiceScreen" class="hidden">

        <header id="practiceHeader">
            <!-- Generated by JavaScript -->
        </header>

        <section id="questionContainer">
            <!-- Question cards will appear here -->
        </section>

    </main>


    <script src="config.js"></script>
    <script src="app.js"></script>

</body>
</html>
